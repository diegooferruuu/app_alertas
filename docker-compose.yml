services:
  postgres:
    # PostgreSQL 15 con PostGIS 3.5.
    #
    # La versión mayor se queda en 15 a propósito: subir a 16 o 17 obliga a
    # recrear el volumen —el formato del directorio de datos cambia entre
    # versiones mayores— y a corregir la documentación del proyecto, que declara
    # PostgreSQL 15. Dentro de la 15, las subidas son compatibles en sitio.
    #
    # La imagen solo se publica para amd64, así que en un Mac con Apple Silicon
    # corre emulada. No hay variante nativa en ninguna de sus versiones.
    image: postgis/postgis:15-3.5
    # Sin esto, Docker en Apple Silicon se niega a bajar la imagen porque no
    # existe manifiesto arm64. Declararlo es lo que activa la emulación.
    platform: linux/amd64
    container_name: app_alertas_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app_alertas}
    # Solo en esta máquina. Sin `127.0.0.1`, Docker publica el puerto en todas
    # las interfaces, y en una red compartida —la de la universidad— cualquiera
    # podría conectarse con la contraseña del README; como superusuario, podría
    # incluso saltarse el disparador que hace el paquete probatorio de solo
    # inserción. Nadie más lo necesita: el backend corre en la misma máquina y
    # los teléfonos hablan con el backend, nunca con la base.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_alertas_network

  pgadmin:
    # Fijada a una versión concreta y no a `latest`: un proyecto que debe poder
    # reproducirse no puede depender de qué etiqueta apunte hoy a qué imagen.
    image: dpage/pgadmin4:9.8
    container_name: app_alertas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    # Solo en esta máquina, por lo mismo que la base: las credenciales de arriba
    # son de ejemplo y están publicadas.
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_alertas_network

volumes:
  postgres_data:

networks:
  app_alertas_network:
    driver: bridge
